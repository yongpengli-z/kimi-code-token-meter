<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kimi Code Token Meter</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1017;
      --panel: #151a24;
      --border: #283041;
      --text: #f2f5fa;
      --muted: #98a2b5;
      --green: #71e2ae;
      --blue: #8fb8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #17223a 0, var(--bg) 42%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1100px, 100%); margin: 0 auto; padding: 42px 24px 28px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
    header span { color: var(--muted); font-size: 13px; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .card {
      min-height: 190px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      box-shadow: 0 18px 45px #0004;
    }
    .label { color: var(--muted); font-size: 14px; }
    .value { margin: 20px 0 14px; font-size: clamp(36px, 7vw, 58px); font-weight: 680; letter-spacing: -0.045em; }
    .speed { color: var(--green); }
    .cache { color: var(--blue); }
    .unit { margin-left: 7px; color: var(--muted); font-size: 15px; font-weight: 500; letter-spacing: 0; }
    .note { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .status-panel { margin-top: 20px; padding: 16px 18px; border: 1px solid var(--border); border-radius: 13px; background: #111620; }
    .status { display: flex; align-items: center; gap: 9px; font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px #71e2ae88; }
    .dot.busy { background: #f7c873; box-shadow: 0 0 12px #f7c87366; }
    .dot.error { background: #ff8f8f; box-shadow: none; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 11px; color: var(--muted); font-size: 12px; }
    .details-panel { margin-top: 20px; overflow: hidden; border: 1px solid var(--border); border-radius: 13px; background: #111620; }
    .details-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--border); }
    .details-heading h2 { margin: 0; font-size: 15px; }
    .details-heading span { color: var(--muted); font-size: 11px; }
    .table-scroll { max-height: 520px; overflow: auto; }
    table { width: 100%; min-width: 920px; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
    th, td { padding: 11px 12px; border-bottom: 1px solid #232b3a; text-align: right; white-space: nowrap; }
    th { position: sticky; top: 0; z-index: 1; background: #171d29; color: var(--muted); font-weight: 500; }
    th:nth-child(-n+3), td:nth-child(-n+3) { text-align: left; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #ffffff05; }
    td.model { max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
    .empty { padding: 28px 18px; color: var(--muted); text-align: center; font-size: 13px; }
    footer { margin-top: 18px; color: #727d91; font-size: 11px; line-height: 1.7; }
    @media (max-width: 620px) {
      main { padding: 28px 16px 20px; }
      header { align-items: flex-start; flex-direction: column; gap: 6px; }
      .cards { grid-template-columns: 1fr; }
      .card { min-height: 155px; }
      .value { margin: 14px 0 10px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Token Meter</h1>
      <span>Kimi Code · 当前会话</span>
    </header>
    <section class="cards" aria-label="当前会话指标">
      <article class="card">
        <div class="label">输出速度</div>
        <div class="value speed"><span id="speed">--</span><span class="unit">token/s</span></div>
        <div class="note">最近完成请求的平均输出速度<br>包含请求首包与生成耗时</div>
      </article>
      <article class="card">
        <div class="label">缓存命中率</div>
        <div class="value cache"><span id="cache">--</span><span class="unit">%</span></div>
        <div class="note">当前会话累计输入<br>包含主 Agent 与子 Agent</div>
      </article>
    </section>
    <section class="status-panel">
      <div class="status" aria-live="polite"><span id="dot" class="dot"></span><span id="status">正在读取本地用量记录…</span></div>
      <div class="meta">
        <span id="session">未发现会话</span>
        <span id="requests">0 次请求</span>
        <span id="tokens">0 输出 token</span>
      </div>
    </section>
    <section class="details-panel" aria-label="请求明细">
      <div class="details-heading"><h2>请求明细</h2><span>最近 100 条 · 按完成时间倒序</span></div>
      <div class="table-scroll" id="details-scroll" hidden>
        <table>
          <thead><tr><th>时间</th><th>Agent</th><th>模型</th><th>未缓存输入</th><th>缓存读取</th><th>输出</th><th>速度</th><th>总耗时</th></tr></thead>
          <tbody id="request-details"></tbody>
        </table>
      </div>
      <div class="empty" id="details-empty">正在读取请求明细…</div>
    </section>
    <footer>仅在本机读取 Kimi Code 用量元数据，不上传对话或代码。<br>页面每秒刷新；连续 15 分钟无访问后，本地服务自动停止。</footer>
  </main>
  <script>
    const byId = id => document.getElementById(id);
    const integer = new Intl.NumberFormat("zh-CN");
    let refreshing = false;
    let detailsKey = "";

    function setStatus(text, state) {
      byId("status").textContent = text;
      byId("dot").className = state === "ok" ? "dot" : `dot ${state}`;
    }

    function timeOf(milliseconds) {
      return milliseconds ? new Date(milliseconds).toLocaleTimeString("zh-CN", { hour12: false }) : "--";
    }

    function modelName(value) {
      if (!value) return "--";
      const parts = value.split("/");
      return parts[parts.length - 1];
    }

    function speedOf(value) {
      return value == null ? "--" : `${value.toFixed(1)} tok/s`;
    }

    function durationOf(value) {
      return value == null ? "--" : `${(value / 1000).toFixed(1)}s`;
    }

    function renderDetails(data) {
      const key = `${data.sessionId}:${data.requestCount}:${data.lastUsageTime}`;
      if (key === detailsKey) return;
      detailsKey = key;
      const records = Array.isArray(data.recentRequests) ? data.recentRequests : [];
      const fragment = document.createDocumentFragment();
      for (const record of records) {
        const row = document.createElement("tr");
        const values = [
          timeOf(record.time),
          record.agentId || "--",
          modelName(record.model),
          integer.format(record.uncachedInputTokens ?? 0),
          integer.format(record.cacheReadTokens ?? 0),
          integer.format(record.outputTokens ?? 0),
          speedOf(record.speedTokensPerSecond),
          durationOf(record.durationMs),
        ];
        values.forEach((value, index) => {
          const cell = document.createElement("td");
          cell.textContent = value;
          if (index === 2) {
            cell.className = "model";
            cell.title = record.model || "";
          }
          row.appendChild(cell);
        });
        fragment.appendChild(row);
      }
      byId("request-details").replaceChildren(fragment);
      byId("details-scroll").hidden = records.length === 0;
      byId("details-empty").hidden = records.length > 0;
      byId("details-empty").textContent = data.sessionFound ? "暂无请求明细" : "未发现会话";
    }

    async function refresh() {
      if (refreshing) return;
      refreshing = true;
      try {
        const sessionId = new URLSearchParams(window.location.search).get("session");
        const metricsUrl = sessionId ? `/api/metrics?session=${encodeURIComponent(sessionId)}` : "/api/metrics";
        const response = await fetch(metricsUrl, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        byId("speed").textContent = data.speedTokensPerSecond == null ? "--" : data.speedTokensPerSecond.toFixed(1);
        byId("cache").textContent = data.cacheHitPercent == null ? "--" : data.cacheHitPercent.toFixed(1);
        byId("session").textContent = data.sessionId ? `会话 …${data.sessionId.slice(-10)}` : "未发现会话";
        byId("requests").textContent = `${integer.format(data.requestCount)} 次请求`;
        byId("tokens").textContent = `${integer.format(data.outputTokens)} 输出 token`;
        renderDetails(data);
        if (data.generating) {
          setStatus("模型生成中 · 速度将在本次请求完成后更新", "busy");
        } else if (data.lastUsageTime) {
          setStatus(`最近用量记录 ${timeOf(data.lastUsageTime)} · 每秒刷新`, "ok");
        } else {
          setStatus("已连接 · 等待本次会话的用量记录", "busy");
        }
      } catch (error) {
        setStatus("本地服务连接失败，正在重试…", "error");
      } finally {
        refreshing = false;
      }
    }

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
